name: Update Static Article Pools

on:
  schedule:
    # Executa semanalmente às segundas-feiras 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quantidade de artigos por idioma'
        required: false
        default: '5000'

jobs:
  update-pools:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static pools (pt & en)
        run: npm run build:pool -- --lang=all --limit=${{ github.event.inputs.limit || '5000' }}

      - name: Commit updated pool JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/pool-pt.json src/data/pool-en.json
          git diff --staged --quiet || git commit -m "chore(pool): automated update of static article pools"
          git push
